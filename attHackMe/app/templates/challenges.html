<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Challenges</title>
  <script src="/static/js/challenges.js" defer></script>
</head>
<body>
  <h1>Liste des challenges</h1>
  <ul id="challenge-list"></ul>

  <hr>

  <div id="challenge-details" style="display: none;">
    <h2 id="challenge-title"></h2>
    <p id="challenge-description"></p>
    <p><strong>IP cible :</strong> <span id="challenge-ip"></span></p>

    <h3>Soumettre un flag</h3>
    <input type="text" id="flag-input" placeholder="Entrez votre flag" />
    <button id="submit-flag">Valider</button>

    <p id="submission-result"></p>
  </div>

  <hr>
  <h2>Machine personnelle : Kali Linux</h2>
  <button id="start-kali">Démarrer Kali</button>
</body>
</html>
