<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AttHackMe - Mon Profil</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Fira Code', monospace;
      background: linear-gradient(to bottom,rgb(127, 219, 199),rgb(58, 6, 100));
    }
  </style>
</head>
<body class="h-screen overflow-hidden flex items-center justify-center bg-[#0a0a1a] text-white">

    <!-- Actions -->
    <header class="absolute top-4 right-6 z-50">
      <button id="logoutBtn" class="dogtag-button">🔒 Logout</button>
    </header>
  <!-- Titre -->
    <div class="relative flex items-center gap-2">
    <img id="soldierImage" src="/static/images/soldiers/soldat1.png"
        alt="soldier" class="w-1/3 max-w-[300px] transition-all duration-300" />

    <button id="nextSoldierBtn" class="text-white bg-purple-600 hover:bg-purple-700 px-2 py-1 rounded-full shadow">
        ➡️
    </button>
    </div>


  <div class="w-[60%] mr-10 ml-auto bg-[#141427] border-2 border-purple-600 p-2 rounded-xl shadow-lg">

    <!-- Bannière -->
    <div class="relative h-40 rounded-lg bg-gradient-to-r from-purple-700 to-indigo-700 overflow-hidden mb-16">
      <img id="current-banner" class="w-full h-full object-cover" src="/static/images/banners/banner.png" alt="Bannière de profil">
      
      <!-- Avatar superposé -->
      <div class="absolute -bottom-0 left-6">
        <img id="current-avatar" src="/static/images/avatars/avatar.png"
             class="w-24 h-24 rounded-full border-4 border-white shadow-lg bg-gray-900 object-cover cursor-pointer"
             alt="Avatar">
      </div>
    </div>

    <!-- Informations utilisateur -->
    <div class="px-6">
        <div class="flex justify-between items-center mb-4 px-0 py-0">
        <div id="userBadge" class="bg-green-700 text-white px-4 py-2 rounded-lg shadow text-sm font-mono hidden">
            👤 <span id="usernameDisplay"></span>
        </div>

      <ul class="text-sm space-y-2">
        <li>✏️ <strong>Niveau</strong> : <span id="userLevel">1</span></li>
        <li>🏆 <strong>Rang</strong> : <span id="userRank">Cadet</span></li>
        <li>🎯 <strong>Points</strong> : <span id="userPoints">0</span></li>
      </ul>

      <p class="mt-4 text-sm text-gray-400">
        🪪 <strong>Email</strong> : <span id="userEmail">user@example.com</span>
        <input type="checkbox" id="emailPublic" class="ml-2">
        <label for="emailPublic">Public</label>
      </p>
    </div>
  </div>

  <footer class="absolute bottom-6 w-full flex justify-center z-50">
    <a href="/" class="text-blue-400 hover:underline text-sm"> Home</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
