<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Challenge Start</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8 font-mono">
  <a href="/home" class="fixed top-4 left-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 shadow">
    Home
  </a>

  <div class="max-w-3xl mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
    <h1 id="challengeTitle" class="text-3xl font-bold text-green-400 mb-4">Loading...</h1>
    <p id="challengeInstructions" class="mb-6 text-sm text-gray-300 whitespace-pre-wrap"></p>

    <form id="flagForm" class="space-y-4">
      <input type="text" id="flagInput" placeholder="Enter the flag..." class="w-full px-4 py-2 bg-gray-700 rounded text-white" required />
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">🎯 Submit Flag</button>
    </form>

    <button id="abandon-btn" class="mt-6 bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded shadow">
      🛑 Give up the challenge
    </button>

    <p id="resultMessage" class="mt-4 text-sm text-yellow-400"></p>

    <!-- Section Review -->
    <div id="reviewSection" class="hidden mt-10">
      <h2 class="text-xl font-bold text-pink-400 mb-2">📝 Leave a Review</h2>
      <form id="reviewForm" class="space-y-3">
        <textarea id="reviewText" rows="4" placeholder="Share your thoughts..." class="w-full p-2 bg-gray-700 rounded text-white"></textarea>
        <input type="number" id="reviewRating" min="1" max="5" placeholder="Rating (1-5)" class="w-24 bg-gray-700 text-white p-2 rounded" />
        <button type="submit" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded text-white">Send</button>
      </form>
      <p id="reviewMessage" class="mt-2 text-sm text-green-400"></p>
    </div>
  </div>

  <script>
    const challengeId = window.location.pathname.split("/").pop();
    const token = localStorage.getItem("access_token") || localStorage.getItem("token");
    const resultMsg = document.getElementById("resultMessage");

    if (!token) {
      alert("🔒 You must be logged in to start this challenge.");
      window.location.href = "/login";
    }

    fetch(`http://127.0.0.1:5000/challenges/${challengeId}`, {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    })
      .then(res => res.json())
      .then(data => {
        document.getElementById("challengeTitle").textContent = data.title;
        document.getElementById("challengeInstructions").textContent = data.instructions;
      })
      .catch(err => {
        document.getElementById("challengeTitle").textContent = "❌ Erreur de chargement";
        console.error(err);
      });

    document.getElementById("flagForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("flagInput").value.trim();

      try {
        const response = await fetch("http://127.0.0.1:5000/challenges/validate_flag", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          credentials: "include",
          body: JSON.stringify({ flag: input, challenge_id: challengeId })
        });

        if (!response.ok) throw new Error("Erreur lors de la requête");

        const result = await response.json();
        resultMsg.textContent = result.message;
        resultMsg.className = result.correct ? "mt-4 text-green-400" : "mt-4 text-red-400";

        if (result.correct) {
          document.getElementById("reviewSection").classList.remove("hidden");
        }
      } catch (err) {
        console.error("Erreur:", err);
        resultMsg.textContent = "❌ Erreur de communication avec le serveur.";
        resultMsg.className = "mt-4 text-red-400";
      }
    });

    document.getElementById("abandon-btn").addEventListener("click", async () => {
      const confirmAbandon = confirm("⚠️ Es-tu sûr de vouloir abandonner ce challenge ?");
      if (!confirmAbandon) return;

      try {
        const res = await fetch(`http://127.0.0.1:5000/progress/challenge/${challengeId}/status`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          credentials: "include",
          body: JSON.stringify({ status: "abandoned" })
        });

        const data = await res.json();
        alert(data.message || "Challenge abandonné.");
        window.location.href = "/challenges";
      } catch (err) {
        alert("❌ Impossible d’abandonner le challenge.");
      }
    });

    document.getElementById("reviewForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = document.getElementById("reviewText").value.trim();
      const rating = document.getElementById("reviewRating").value;

      try {
        const res = await fetch(`http://127.0.0.1:5000/reviews/challenge/${challengeId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          credentials: "include",
          body: JSON.stringify({ text, rating })
        });

        const data = await res.json();
        document.getElementById("reviewMessage").textContent = data.message || "Merci pour ta review !";
      } catch (err) {
        document.getElementById("reviewMessage").textContent = "❌ Erreur lors de l'envoi de la review.";
      }
    });
  </script>
</body>
</html>
