<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard - AttHackMe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Share Tech Mono', monospace; }
  </style>
</head>
<body class="bg-[#0f0f1b] text-white px-6 py-6 min-h-screen">

  <h1 class="text-4xl text-purple-400 font-bold text-center mb-8">🏆 Leaderboard</h1>

  <div id="leaderboard" class="max-w-3xl mx-auto space-y-4"></div>

  <div class="text-center mt-10">
    <button id="getMyRankBtn" class="bg-indigo-600 px-4 py-2 rounded hover:bg-indigo-700 transition">
      👤 Get My Rank
    </button>
    <div id="myRank" class="mt-4 text-lg text-green-400 font-mono"></div>
  </div>

  <div class="text-center mt-8">
    <a href="/" class="text-indigo-400 hover:underline">← Back Home</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const leaderboardDiv = document.getElementById("leaderboard");
      const myRankDiv = document.getElementById("myRank");

      // Fetch top 10
      fetch("http://127.0.0.1:5000/leaderboard")
        .then(res => res.json())
        .then(data => {
          data.forEach((user, index) => {
            const card = document.createElement("div");
            card.className = "bg-white/10 p-4 rounded-lg shadow flex items-center justify-between";

            card.innerHTML = `
              <div class="flex items-center gap-4">
                <span class="text-2xl font-bold text-yellow-400">#${index + 1}</span>
                <div>
                  <p class="text-lg font-semibold text-green-300">${user.username}</p>
                  <p class="text-sm text-gray-300">${user.points} pts</p>
                </div>
              </div>
              ${user.avatar_url ? `<img src="${user.avatar_url}" class="w-10 h-10 rounded-full">` : ""}
            `;
            leaderboardDiv.appendChild(card);
          });
        });

      // Get current user rank
      document.getElementById("getMyRankBtn").addEventListener("click", () => {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Please login first.");
          window.location.href = "/login";
          return;
        }

        fetch("http://127.0.0.1:5000/leaderboard/me", {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`
          }
        })
          .then(res => res.json())
          .then(data => {
            if (data.rank) {
              myRankDiv.innerHTML = `🎖️ You are <span class="text-yellow-300 font-bold">#${data.rank}</span> with <span class="text-blue-300">${data.points} points</span>`;
            } else {
              myRankDiv.innerText = "You are not ranked yet.";
            }
          });
      });
    });
  </script>
</body>
</html>
