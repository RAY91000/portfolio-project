<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AttHackMe - Profil</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center">

  <div class="text-center max-w-xl w-full p-4 rounded-lg bg-[#1e1e2f] shadow-lg">
    <!-- Bannière -->
    <div class="relative mb-4">
      <img id="current-banner" src="/static/images/banners/banner1.jpg" alt="Bannière" class="w-full h-40 object-cover rounded-lg" />
      <!-- Avatar superposé -->
      <img id="current-avatar" src="/static/images/avatars/avatar1.png" alt="Avatar"
           class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 w-20 h-20 rounded-full border-4 border-white bg-gray-800 cursor-pointer" />
    </div>

    <!-- Nom d'utilisateur -->
    <h1 class="text-2xl font-bold mt-10" id="usernameDisplay">Utilisateur</h1>

    <!-- Email affiché publiquement (si activé) -->
    <p class="text-sm text-gray-400 mt-1" id="userEmail"></p>

    <!-- Badge utilisateur -->
    <div id="userBadge" class="mt-2 hidden bg-green-600 text-white py-1 px-3 rounded-full text-sm inline-block">
      Connecté
    </div>

    <!-- Boutons -->
    <div class="mt-6 flex justify-center gap-4">
      <a href="/settings" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
        ⚙️ Paramètres
      </a>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
        🔒 Déconnexion
      </button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
